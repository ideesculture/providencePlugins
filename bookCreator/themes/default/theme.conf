# Default theme for the bookCreator plugin.
#
# A theme is self-describing: this file declares the page formats, the
# typographic pairs and the design tokens; the stylesheets under css/ only ever
# read custom properties. At render time ThemeRegistry emits a :root block, an
# @page rule and the @font-face declarations from what is declared here, so
# choosing a format or a font pair is configuration, never a recompilation.
#
# The same output feeds WeasyPrint and the Paged.js preview.

name = Default

# ----------------------------------------------------------------------------
# Page formats
#
# width and height are the trim size. Anything declared under tokens overrides
# the theme-wide token of the same name for that format only, which is how a
# small booklet tightens its margins without duplicating the theme.
# ----------------------------------------------------------------------------
formats = {
	a4-landscape = {
		label = A4 landscape,
		width = 297mm,
		height = 210mm,
		margin = 12mm
	},
	a4-portrait = {
		label = A4 portrait,
		width = 210mm,
		height = 297mm,
		margin = 15mm
	},
	square-21 = {
		label = Booklet 21x21,
		width = 210mm,
		height = 210mm,
		margin = 12mm
	},
	a5-portrait = {
		label = A5 portrait,
		width = 148mm,
		height = 210mm,
		margin = 10mm,
		tokens = {
			font-size-body = 9pt,
			gutter = 5mm
		}
	},
	a5-landscape = {
		label = A5 landscape,
		width = 210mm,
		height = 148mm,
		margin = 10mm,
		tokens = {
			font-size-body = 9pt,
			gutter = 5mm
		}
	}
}

# ----------------------------------------------------------------------------
# Typographic pairs
#
# Libre fonts only (OFL), shipped under fonts/ so nothing is fetched from a CDN
# at render time. files is a directory relative to this theme; every font file
# it holds is declared, with weight and style read from the file name.
# ----------------------------------------------------------------------------
font_pairs = {
	garamond-sourcesans = {
		label = "EB Garamond & Source Sans 3",
		heading = { family = EB Garamond, files = fonts/EBGaramond },
		body = { family = Source Sans 3, files = fonts/SourceSans3 }
	},
	playfair-lato = {
		label = "Playfair Display & Lato",
		heading = { family = Playfair Display, files = fonts/PlayfairDisplay },
		body = { family = Lato, files = fonts/Lato }
	},
	cormorant-worksans = {
		label = "Cormorant & Work Sans",
		heading = { family = Cormorant, files = fonts/Cormorant },
		body = { family = Work Sans, files = fonts/WorkSans }
	},
	spectral-plexsans = {
		label = "Spectral & IBM Plex Sans",
		heading = { family = Spectral, files = fonts/Spectral },
		body = { family = IBM Plex Sans, files = fonts/IBMPlexSans }
	}
}

# ----------------------------------------------------------------------------
# Design tokens
#
# Emitted as custom properties on :root, prefixed with --. Names are free: the
# registry never interprets them, it only passes them through, so a theme may
# declare as many as its stylesheets need.
# ----------------------------------------------------------------------------
tokens = {
	# Hexadecimal colours must be quoted: an unquoted token starting with # is
	# read as a comment by the configuration parser and silently dropped.
	color-ink = "#1a1a1a",
	color-accent = "#7a1f1f",
	color-muted = "#6b6b6b",
	font-size-body = 10pt,
	font-size-heading = 18pt,
	font-size-caption = 8pt,
	line-height = 1.3,
	gutter = 8mm,
	baseline = 4mm
}

# Stylesheets loaded after the generated :root block, in this order.
stylesheets = [
	css/base.css
]
