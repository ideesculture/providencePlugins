# Default theme for the bookCreator plugin.
#
# A theme is self-describing: this file declares the page formats, the
# typographic pairs and the design tokens; the stylesheets under css/ only ever
# read custom properties. At render time ThemeRegistry emits a :root block, an
# @page rule and the @font-face declarations from what is declared here, so
# choosing a format or a font pair is configuration, never a recompilation.
#
# The same output feeds WeasyPrint and the Paged.js preview.

name = Default

# ----------------------------------------------------------------------------
# Page formats
#
# width and height are the trim size. Anything declared under tokens overrides
# the theme-wide token of the same name for that format only, which is how a
# small booklet tightens its margins without duplicating the theme.
# ----------------------------------------------------------------------------
formats = {
	a4-landscape = {
		label = A4 landscape,
		width = 297mm,
		height = 210mm,
		margin = 12mm
	},
	a4-portrait = {
		label = A4 portrait,
		width = 210mm,
		height = 297mm,
		margin = 15mm
	},
	square-21 = {
		label = Booklet 21x21,
		width = 210mm,
		height = 210mm,
		margin = 12mm
	},
	a5-portrait = {
		label = A5 portrait,
		width = 148mm,
		height = 210mm,
		margin = 10mm,
		tokens = {
			font-size-body = 9pt,
			gutter = 5mm
		}
	},
	a5-landscape = {
		label = A5 landscape,
		width = 210mm,
		height = 148mm,
		margin = 10mm,
		tokens = {
			font-size-body = 9pt,
			gutter = 5mm
		}
	}
}

# ----------------------------------------------------------------------------
# Typographic pairs
#
# Libre fonts only (OFL), shipped under fonts/ so nothing is fetched from a CDN
# at render time. files is a directory relative to this theme; every font file
# it holds is declared, with weight and style read from the file name.
# ----------------------------------------------------------------------------
# Only pairs whose font files are actually shipped are declared. A pair
# pointing at a missing directory produces no @font-face at all and silently
# falls back to the generic serif of the renderer — which would make a
# page-by-page acceptance run meaningless.
#
# To add a pair: drop the font files in fonts/<Family>/, named
# Family-Regular, Family-Bold, Family-Italic, Family-BoldItalic (the weight and
# style are read from the file name), and add an entry here. Libre fonts only.
font_pairs = {
	garamond-sourcesans = {
		label = "EB Garamond & Source Sans 3",
		heading = { family = EB Garamond, files = fonts/EBGaramond },
		body = { family = Source Sans 3, files = fonts/SourceSans3 }
	},
	garamond-smallcaps = {
		label = "EB Garamond, small caps headings",
		heading = { family = EB Garamond SC, files = fonts/EBGaramondSC },
		body = { family = EB Garamond, files = fonts/EBGaramond }
	},
	# Paire du catalogue Floutier v1 : un seul Garamond pour les titres et pour
	# le texte courant. La v1 tirait « Cormorant Garamond » de Google Fonts via
	# un @import ; la refonte a supprimé les dépendances CDN, les fichiers sont
	# donc embarqués sous fonts/CormorantGaramond (OFL, Catharsis Fonts v4.002).
	#
	# Le romain du livre est le MEDIUM (500), pas le Regular (400). Relevé sur
	# les 170 sections du PDF v1 validé : 162 emplois de CormorantGaramond-Medium,
	# 18 de MediumItalic, aucun Regular et aucun gras. La feuille v1 demandait
	# pourtant `font-weight: 400` — c'est le chargement Google Fonts de l'époque
	# qui servait le Medium. Livrer le Regular donnerait une page visiblement
	# plus maigre que celle validée par le client.
	#
	# Les fichiers Medium sont donc déclarés comme la graisse normale : rien dans
	# le nom ne contient « bold », findFontFiles() les classe en normal, et le
	# document n'a pas à connaître ce détail.
	#
	# Ne pas remettre Regular ni Italic à côté : ils tomberaient dans la même
	# case et, scandir() étant alphabétique, c'est Regular qui l'emporterait.
	# Pour la même raison, ne jamais ajouter SemiBold — « bold » y figure, il
	# serait déclaré comme le gras et écraserait le vrai.
	cormorant-garamond = {
		label = "Cormorant Garamond",
		heading = { family = Cormorant Garamond, files = fonts/CormorantGaramond },
		body = { family = Cormorant Garamond, files = fonts/CormorantGaramond }
	}
}

# ----------------------------------------------------------------------------
# Design tokens
#
# Emitted as custom properties on :root, prefixed with --. Names are free: the
# registry never interprets them, it only passes them through, so a theme may
# declare as many as its stylesheets need.
# ----------------------------------------------------------------------------
# Values are calibrated for A4 landscape, the format the stylesheets were
# written against. Other formats override what they need under formats/tokens.
# --content-height and --grid-row-height are NOT declared here: base.css
# derives them from the page geometry.
tokens = {
	# --- Page ---------------------------------------------------------------
	# Must stay equal to the margin of the format in use. ThemeRegistry should
	# emit it from formats/<code>/margin so the two cannot drift apart.
	page-margin = 12mm,

	# --- Colours ------------------------------------------------------------
	# Hexadecimal colours must be quoted: an unquoted token starting with # is
	# read as a comment by the configuration parser and silently dropped.
	color-ink = "#1a1a1a",
	color-accent = "#7a1f1f",
	color-muted = "#6b6b6b",
	color-caption = "#555555",
	color-rule-strong = "#1a1a1a",
	color-rule-light = "#808080",
	# Filet marquant le bord de page dans l'aperçu navigateur. Il ne s'imprime
	# pas : voir la règle .pagedjs_page en fin de css/base.css.
	color-page-edge = "#bbbbbb",
	color-image-placeholder = "#eeeeee",
	color-quote-text = "#444444",
	color-quote-bg = "#f9f9f9",
	color-quote-border = "#cccccc",
	color-link = "#666666",

	# --- Typography ---------------------------------------------------------
	# --- Corps et interlignes, calés sur le rendu v1 -------------------------
	# Toutes les valeurs ci-dessous sont des LONGUEURS ABSOLUES, et non des em
	# ou des rapports. wkhtmltopdf raisonnait en pixels entiers à 96 dpi et
	# arrondissait corps et interlignes ; le rendu validé par le client porte
	# donc ces valeurs arrondies, pas celles que déclarait la feuille. La règle
	# appliquée partout : px = arrondi(pt x 4/3), puis pt = px x 0,75.
	# Le calcul est rappelé en regard de chaque valeur.
	# 11,5pt -> 15,33px -> 15px
	font-size-body = 11.25pt,
	# Défauts du navigateur, tronqués au pixel, tels que la v1 les a imprimés :
	#   h2 : 1.5em de 15px  = 22,5px  -> 22px = 16,5pt  ; marge 0.83em -> 18px
	#   h3 : 1.17em de 15px = 17,55px -> 17px = 12,75pt ; marge 1em    -> 17px
	#   h1 : marge 0.67em de 61px = 40,87px -> 40px = 30pt
	font-size-heading = 18pt,
	font-size-h2 = 16.5pt,
	font-size-h3 = 12.75pt,
	space-h2-y = 13.5pt,
	space-h3-y = 12.75pt,
	space-h1-bottom = 30pt,
	# 46pt -> 61,33px -> 61px
	font-size-chapter-title = 45.75pt,
	# 45.75pt et non 4em. Même cause que line-height : wkhtmltopdf arrondissait
	# aussi le CORPS au pixel entier à 96 dpi. 4em de 11,5 pt = 46 pt = 61,33 px,
	# arrondis à 61 px = 45,75 pt. Vérifié sur la largeur des mots : le titre v1
	# est 0,55 % plus large que le même texte composé à 46 pt.
	font-size-title = 45.75pt,
	# Notices des grilles autres que 6-par-page. La feuille v1 y demandait
	# « font-size: 9 px » — avec une espace avant l'unité, donc une déclaration
	# INVALIDE, que le moteur écartait : ces notices se composaient au corps
	# courant. Le 9pt qui figurait ici rétablissait l'intention de l'auteur, mais
	# s'écartait du livre validé. On s'aligne sur le rendu, pas sur le code.
	# hérité du corps courant, comme en v1
	font-size-caption = 11.25pt,
	# 9,4pt -> 12,53px -> 13px
	font-size-caption-large = 9.75pt,
	# Interligne propre aux notices de la grille 6 par page : 1.05em y porte sur
	# 13px et non sur 15px, l'arrondi ne tombe donc pas sur la même valeur que
	# line-height-tight.
	# 1.05em de 13px -> 13,65px -> 14px
	# 1.05em de 13px = 13,16px -> 13px
	line-height-caption-large = 9.75pt,
	# 11pt -> 14,67px -> 15px
	font-size-name = 11.25pt,
	# 8.25pt et non 0.7em : 0,7 em de 11,5 pt = 8,05 pt = 10,73 px, arrondis à
	# 11 px = 8,25 pt. Mesuré sur trois mots du dos de page de titre, le texte
	# v1 est 2,4 % plus large — assez pour déplacer les coupures de ligne.
	font-size-legal = 8.25pt,
	# 0.8em de 11,5pt -> 12,27px -> 12px
	font-size-credit = 9pt,
	# 1.15em de 11,5pt -> 17,63px -> 18px
	font-size-quote = 13.5pt,
	# idem font-size-chapter-title
	font-size-quote-mark = 45.75pt,
	# 1.2em et non 1.2 : la nuance décide de tout le texte composé dans un corps
	# différent du corps courant. Sans unité, l'interligne est un rapport, que
	# chaque descendant recalcule sur SON corps ; avec l'unité, c'est une
	# longueur, calculée une fois sur le corps du body et héritée telle quelle.
	# La v1 écrivait 1.2em partout. Sur le dos de page de titre, composé en
	# 0.7em, l'écart est de 13,8 pt d'interligne contre 9,7 : le bloc entier
	# était tassé d'un tiers par rapport à la sortie validée.
	# Valeur absolue, et non 1.2em, parce que la v1 n'a jamais composé à 1.2em :
	# wkhtmltopdf raisonnait en pixels à 96 dpi et TRONQUAIT l'interligne au
	# pixel entier. 1.2em de 11,5 pt = 18,4 px, ramenés à 18 px = 13,5 pt. La
	# vérification tombe juste sur les deux corps mesurés : 13,50 pt relevé sur
	# le dos de page de titre, 45,75 pt sur le titre (61,33 px ramenés à 61).
	# Écrire directement la longueur reproduit le résultat sans imiter le
	# mécanisme, et sans dépendre du corps courant.
	line-height = 13.5pt,
	# Folio and running heads. Read by ThemeRegistry when it builds the 
	# margin boxes, which cannot resolve custom properties reliably.
	font-size-folio = 9pt,
	color-folio = "#6b6b6b",
	# 1.1em de 15px -> 16,5px -> 16px
	line-height-text = 12pt,
	# 1.05em de 15px -> 15,75px -> 16px
	# Les interlignes sont TRONQUES au pixel, alors que les corps sont ARRONDIS.
	# Vérifié sur la grille 6 par page : 1.05em de 13px = 13,16px, rendu à 13px
	# (9,75pt) et non 14px. Les deux valeurs relevées sur le PDF v1 — 9,75 pt
	# entre lignes d'un même champ, 10,50 pt entre deux champs — se déduisent
	# de 13px d'interligne plus 1px de marge.
	# 1.05em de 15px = 15,75px -> 15px
	line-height-tight = 11.25pt,
	# 1.3em de 61px -> 79,3px -> 79px
	line-height-chapter-title = 59.25pt,
	# 45.75pt : 4em de 11,5 pt = 61,33 px tronqués à 61 px. Voir line-height.
	line-height-title = 45.75pt,
	# 0.9em de 12px -> 10,8px -> 11px
	# 0.9em de 12px = 10,8px -> 10px
	line-height-credit = 7.5pt,
	# normal, et non small-caps. La feuille v1 demandait des petites capitales
	# sur les titres, sur .name et sur la page de titre — le PDF validé n'en
	# porte AUCUNE. La webfont Cormorant Garamond n'expose pas de jeu smcp et
	# le WebKit de wkhtmltopdf ne les synthétisait pas ; WeasyPrint, lui, les
	# synthétise. Vérifié à la loupe sur les notices : « Vue du Pays Basque »
	# en v1, « Vue du Pays Basque » en petites capitales en v2 avant correctif.
	font-variant-heading = normal,
	font-weight-body = 400,
	# 400 et non 700 : le PDF v1 validé n'imprime aucun gras. La feuille v1
	# déclarait pourtant `body b { font-weight: 700 }`, mais le chargement Google
	# Fonts ne fournissait que le Medium et le moteur n'a jamais synthétisé de
	# gras — relevé sur les 170 sections, zéro occurrence d'une fonte grasse.
	# base.css continue de lire ce token pour b et strong : le poser à 400 rend
	# le gras inopérant sans toucher au balisage ni supprimer la fonte grasse,
	# qui reste livrée pour un thème qui voudrait s'en servir.
	font-weight-bold = 400,
	# Small caps set solid read badly; a little tracking is part of the design.
	# Interlettrage nul : il n'accompagnait que les petites capitales, que la v1
	# n'imprimait pas.
	letter-spacing-smallcaps = normal,

	# --- Margins and gutters ------------------------------------------------
	gutter = 10mm,
	margin-text-outer = 20mm,
	margin-hors-texte-outer = 40mm,
	# 57 et 17 mm, et non 60 et 20. La v1 appliquait ces retraits à un bloc
	# inscrit dans un body à 9 mm de marge, la v2 à une page à 12 mm : à
	# valeurs égales, la colonne de texte partait 3 mm trop à droite ET perdait
	# 6 mm de justification, ce qui rallongeait chaque paragraphe d'une ligne.
	# Corrigés, le bord gauche du texte retombe à 69 mm et le bord droit à
	# 268 mm, comme en v1.
	# margin-chapter-outer est distinct de margin-text-outer, qui sert aux
	# planches et aux grilles et n'a pas la même origine.
	indent-chapter-text = 57mm,
	margin-chapter-outer = 17mm,
	indent-chapter-two-col = 90mm,
	chapter-column-gap = 20mm,
	# 9 et non 12 : la v1 posait 12 mm sur un body déjà retiré de 9 mm ; la v2
	# part d'une page à 12 mm. Le titre retombe ainsi à 21 mm du bord.
	chapter-image-margin-inline = 9mm,
	list-indent-narrow = 4mm,

	# --- Vertical spacing ---------------------------------------------------
	# Calage vertical de la page de titre, relevé au point près sur le PDF v1
	# validé par le client (repères : ligne d'auteur, première ligne du titre,
	# ligne d'éditeur). Les valeurs ne sont pas rondes parce qu'elles ne
	# décrivent pas une intention de maquette : elles reproduisent le résultat
	# d'un autre moteur, dont le modèle de boîte différait (marges par défaut
	# des <p>, marges de page de wkhtmltopdf).
	space-page-top = 11.925mm,
	# 38.33 et non 40 : la v1 posait 4cm de retrait haut sur un bloc bordé d'un
	# filet blanc de 1pt, dans un body à 9mm de marge. Écart relevé sur le titre
	# et le premier sous-titre de l'introduction, constant à 4,7 pt.
	# 49.14 : les 4 cm de retrait déclarés par la v1, plus la marge haute par
	# défaut du h1 (0.67em de 61px, tronquée à 40px = 30 pt) que la v1 laissait
	# agir et que base.css remet à zéro. Le total est écrit ici plutôt que
	# rétabli en marge : une marge sur h1 se propagerait aux liminaires, dont
	# le calage est décrit au point près.
	space-title-top = 49.14mm,
	space-title-page-top = 40.652mm,
	# Écart entre le bas du titre et la ligne d'éditeur. Était exprimé en
	# --gutter, qui sert partout ailleurs et ne pouvait donc pas être ajusté
	# pour cette seule page.
	# Écart entre le bas du titre et la ligne d'éditeur, relevé sur la v1.
	# La compensation de 0,35 mm qui figurait ici n'a plus lieu d'être :
	# elle rattrapait la dérive d'interligne du bloc de titre, désormais
	# supprimée à la source par line-height-title.
	space-title-page-bottom = 20.731mm,
	space-cover-top = 100mm,
	# 6.05 et non 12 : le retrait haut de la v1 s'appliquait à une cellule de
	# tableau dans un body à 10 mm de marge haute, celui de la v2 à une page à
	# 12 mm, et la marge du premier paragraphe ne se comporte pas de la même
	# façon de part et d'autre. Écart relevé, constant à 16,87 pt.
	space-column-top = 6.05mm,
	space-text-block-top = 6mm,
	space-blockquote-top = 7mm,
	space-quote-inline = 3mm,
	# 0.7em de 15px = 10,5px : arrondi à 11px = 8,25pt (et non tronqué à 10px —
	# les deux hypothèses ont été rendues, celle-ci colle aux écarts relevés).
	space-paragraph = 8.25pt,
	# Marge verticale des <p>, celle que la v1 héritait du navigateur. Se
	# fusionne entre paragraphes voisins : l'écart obtenu est de 1em, pas 2em.
	space-paragraph-block = 1em,
	# Le dos de page de titre est composé en 0.7em : 1em de marge y vaut
	# 10,73 px, que wkhtmltopdf tronquait à 10 px = 7,5 pt. Valeur absolue
	# pour ce bloc, la troncature ne pouvant pas s'exprimer en em.
	space-paragraph-legal = 7.5pt,
	# 0.1em de 13px -> 1,3px -> 1px
	space-caption-y = 0.75pt,
	# 0.2em de 15px -> 3px
	space-name-y = 2.25pt,
	# v1 : margin-top 6px
	space-notice-title-top = 4.5pt,
	space-media-bottom = 8mm,
	space-media-gap = 5mm,
	space-figure-y = 8pt,
	space-line = 2.1mm,

	# --- Measures and blocks ------------------------------------------------
	measure-narrow = 70mm,
	title-max-width = 150mm,
	colophon-max-width = 70mm,
	legal-max-width = 100mm,
	# 70.64 et non 73 : la v1 posait ce bloc par `position: relative; top: 7.3cm`
	# depuis sa position statique, la v2 par une marge haute. Écart relevé sur
	# les dix premières lignes du bloc, constant à 6,69 pt.
	legal-top = 70.682mm,
	legal-margin-left = 4mm,
	# 58 et non 60, même raison : marge haute de 10 mm en v1, de 12 mm en v2.
	content-text-top = 58mm,
	# Retrait gauche du texte dans le gabarit chapitre-avec-image : la v1
	# écrivait margin-left: 9.3cm sur ce bloc.
	indent-chapter-image-text = 93mm,
	mediacolumn-width = 106mm,
	mediacolumn-top = 84mm,
	# Débord droit de la colonne d'image du gabarit chapitre-avec-image : écart
	# relevé entre le bord droit de la légende en v1 (289,1 mm) et en v2.
	mediacolumn-right-shift = 16.6mm,
	# Débord du filet de titre au-delà de la colonne d'image, jusqu'à la coupe.
	# Longueur du filet de titre, relevée sur la v1 : 21,0 à 294,9 mm.
	chapter-title-width = 274mm,
	table-media-width = 80mm,
	# Cellules de texte des gabarits texte-deux-images, retraits compris : la v1
	# donnait 14 cm au TEXTE, on y ajoute les retraits de part et d'autre.
	# gauche  : 20 + 140 + 16,59   droite : 32 + 140 + 20
	table-text-cell-left = 176.59mm,
	table-text-cell-right = 192mm,
	# 32 et non 35 : 3 mm de moins pour absorber l'écart entre la marge de body
	# de la v1 (9 mm) et la marge de page de la v2 (12 mm).
	table-text-pad-left = 32mm,
	# Retrait gauche du gabarit texte-deux-images-gauche. Distinct de
	# margin-text-outer, qui sert aux planches : 20 mm en v1 sur un body à
	# 9 mm, soit 17 mm sur une page à 12 mm.
	margin-two-images-left = 16.59mm,

	# --- Images -------------------------------------------------------------
	image-box-height = 60mm,
	image-box-height-sm = 40mm,
	image-box-width-sm = 40%,
	figure-height = 70mm,
	# 165.5 : la v1 posait `height: 90%` sur un body de 184 mm de haut.
	full-image-height = 165.5mm,
	plate-image-max-height = 170mm,
	hors-texte-media-width = 62%,
	hors-texte-media-width-right = 50%,

	# --- Grids --------------------------------------------------------------
	# The number of cells across is declared, never deduced from a width.
	grid-columns-dense = 3,
	# Géométrie de la grille 6 par page, relevée sur le PDF v1 : cellule de
	# 7,4 cm, pas horizontal de 9,3 cm, première colonne à 18 mm du bord.
	# Voir le commentaire de sets.css : c'est de là que venait l'agrandissement
	# de 14 % de toutes les illustrations.
	grid-cell-width = 74mm,
	grid-cell-height = 86mm,
	grid-gap-x = 19.5mm,
	grid-gap-y = 1.3mm,
	grid-offset-left = 6mm,
	grid-offset-top = 2.5mm,
	grid-columns-wide = 2,
	grid-gap-wide = 26mm,
	chapter-columns = 2,
	# Rows a plate spans inside a notice laid out beside its text. Must be at
	# least the number of fields a notice can hold.
	notice-lines = 8,

	# --- Rules --------------------------------------------------------------
	rule-width = 0.75pt,
	rule-quote-width = 3mm
}

# Stylesheets loaded after the generated :root block, in this order.
stylesheets = [
	css/base.css,
	css/templates/front-matter.css,
	css/templates/chapters.css,
	css/templates/plates.css,
	css/templates/sets.css
]
