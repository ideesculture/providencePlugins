# Default theme for the bookCreator plugin.
#
# A theme is self-describing: this file declares the page formats, the
# typographic pairs and the design tokens; the stylesheets under css/ only ever
# read custom properties. At render time ThemeRegistry emits a :root block, an
# @page rule and the @font-face declarations from what is declared here, so
# choosing a format or a font pair is configuration, never a recompilation.
#
# The same output feeds WeasyPrint and the Paged.js preview.

name = Default

# ----------------------------------------------------------------------------
# Page formats
#
# width and height are the trim size. Anything declared under tokens overrides
# the theme-wide token of the same name for that format only, which is how a
# small booklet tightens its margins without duplicating the theme.
# ----------------------------------------------------------------------------
formats = {
	a4-landscape = {
		label = A4 landscape,
		width = 297mm,
		height = 210mm,
		margin = 12mm
	},
	a4-portrait = {
		label = A4 portrait,
		width = 210mm,
		height = 297mm,
		margin = 15mm
	},
	square-21 = {
		label = Booklet 21x21,
		width = 210mm,
		height = 210mm,
		margin = 12mm
	},
	a5-portrait = {
		label = A5 portrait,
		width = 148mm,
		height = 210mm,
		margin = 10mm,
		tokens = {
			font-size-body = 9pt,
			gutter = 5mm
		}
	},
	a5-landscape = {
		label = A5 landscape,
		width = 210mm,
		height = 148mm,
		margin = 10mm,
		tokens = {
			font-size-body = 9pt,
			gutter = 5mm
		}
	}
}

# ----------------------------------------------------------------------------
# Typographic pairs
#
# Libre fonts only (OFL), shipped under fonts/ so nothing is fetched from a CDN
# at render time. files is a directory relative to this theme; every font file
# it holds is declared, with weight and style read from the file name.
# ----------------------------------------------------------------------------
# Only pairs whose font files are actually shipped are declared. A pair
# pointing at a missing directory produces no @font-face at all and silently
# falls back to the generic serif of the renderer — which would make a
# page-by-page acceptance run meaningless.
#
# To add a pair: drop the font files in fonts/<Family>/, named
# Family-Regular, Family-Bold, Family-Italic, Family-BoldItalic (the weight and
# style are read from the file name), and add an entry here. Libre fonts only.
font_pairs = {
	garamond-sourcesans = {
		label = "EB Garamond & Source Sans 3",
		heading = { family = EB Garamond, files = fonts/EBGaramond },
		body = { family = Source Sans 3, files = fonts/SourceSans3 }
	},
	garamond-smallcaps = {
		label = "EB Garamond, small caps headings",
		heading = { family = EB Garamond SC, files = fonts/EBGaramondSC },
		body = { family = EB Garamond, files = fonts/EBGaramond }
	}
}

# ----------------------------------------------------------------------------
# Design tokens
#
# Emitted as custom properties on :root, prefixed with --. Names are free: the
# registry never interprets them, it only passes them through, so a theme may
# declare as many as its stylesheets need.
# ----------------------------------------------------------------------------
# Values are calibrated for A4 landscape, the format the stylesheets were
# written against. Other formats override what they need under formats/tokens.
# --content-height and --grid-row-height are NOT declared here: base.css
# derives them from the page geometry.
tokens = {
	# --- Page ---------------------------------------------------------------
	# Must stay equal to the margin of the format in use. ThemeRegistry should
	# emit it from formats/<code>/margin so the two cannot drift apart.
	page-margin = 12mm,

	# --- Colours ------------------------------------------------------------
	# Hexadecimal colours must be quoted: an unquoted token starting with # is
	# read as a comment by the configuration parser and silently dropped.
	color-ink = "#1a1a1a",
	color-accent = "#7a1f1f",
	color-muted = "#6b6b6b",
	color-caption = "#555555",
	color-rule-strong = "#1a1a1a",
	color-rule-light = "#808080",
	color-image-placeholder = "#eeeeee",
	color-quote-text = "#444444",
	color-quote-bg = "#f9f9f9",
	color-quote-border = "#cccccc",
	color-link = "#666666",

	# --- Typography ---------------------------------------------------------
	font-size-body = 11.5pt,
	font-size-heading = 18pt,
	font-size-chapter-title = 46pt,
	font-size-title = 4em,
	# Notices in the dense grids. The source stylesheet asked for 9px, which is
	# an invalid declaration and was dropped; those notices therefore printed at
	# body size. 9pt restores the intended size.
	font-size-caption = 9pt,
	font-size-caption-large = 9.4pt,
	font-size-name = 11pt,
	font-size-legal = 0.7em,
	font-size-credit = 0.8em,
	font-size-quote = 1.15em,
	font-size-quote-mark = 4em,
	line-height = 1.2,
	# Folio and running heads. Read by ThemeRegistry when it builds the 
	# margin boxes, which cannot resolve custom properties reliably.
	font-size-folio = 9pt,
	color-folio = "#6b6b6b",
	line-height-text = 1.1,
	line-height-tight = 1.05,
	line-height-chapter-title = 1.3,
	line-height-title = 1,
	line-height-credit = 0.9,
	font-variant-heading = small-caps,
	font-weight-body = 400,
	font-weight-bold = 700,
	# Small caps set solid read badly; a little tracking is part of the design.
	letter-spacing-smallcaps = 0.02em,

	# --- Margins and gutters ------------------------------------------------
	gutter = 10mm,
	margin-text-outer = 20mm,
	margin-hors-texte-outer = 40mm,
	indent-chapter-text = 60mm,
	indent-chapter-two-col = 90mm,
	chapter-column-gap = 20mm,
	chapter-image-margin-inline = 12mm,
	list-indent-narrow = 4mm,

	# --- Vertical spacing ---------------------------------------------------
	space-page-top = 10mm,
	space-title-top = 40mm,
	space-title-page-top = 30mm,
	space-cover-top = 100mm,
	space-column-top = 12mm,
	space-text-block-top = 6mm,
	space-blockquote-top = 7mm,
	space-quote-inline = 3mm,
	space-paragraph = 0.7em,
	space-caption-y = 0.1em,
	space-name-y = 0.2em,
	space-notice-title-top = 2mm,
	space-media-bottom = 8mm,
	space-media-gap = 5mm,
	space-figure-y = 8pt,
	space-line = 2.1mm,

	# --- Measures and blocks ------------------------------------------------
	measure-narrow = 70mm,
	title-max-width = 150mm,
	colophon-max-width = 70mm,
	legal-max-width = 100mm,
	legal-top = 73mm,
	legal-margin-left = 4mm,
	content-text-top = 60mm,
	mediacolumn-width = 106mm,
	mediacolumn-top = 84mm,
	table-media-width = 80mm,
	table-text-pad-left = 35mm,

	# --- Images -------------------------------------------------------------
	image-box-height = 60mm,
	image-box-height-sm = 40mm,
	image-box-width-sm = 40%,
	figure-height = 70mm,
	full-image-height = 186mm,
	plate-image-max-height = 170mm,
	hors-texte-media-width = 62%,
	hors-texte-media-width-right = 50%,

	# --- Grids --------------------------------------------------------------
	# The number of cells across is declared, never deduced from a width.
	grid-columns-dense = 3,
	grid-columns-wide = 2,
	grid-gap-wide = 26mm,
	chapter-columns = 2,
	# Rows a plate spans inside a notice laid out beside its text. Must be at
	# least the number of fields a notice can hold.
	notice-lines = 8,

	# --- Rules --------------------------------------------------------------
	rule-width = 0.75pt,
	rule-quote-width = 3mm
}

# Stylesheets loaded after the generated :root block, in this order.
stylesheets = [
	css/base.css,
	css/templates/front-matter.css,
	css/templates/chapters.css,
	css/templates/plates.css,
	css/templates/sets.css
]
