# Full-page plate.
#
# One pinned representation, centred on the page area, with whatever Markdown
# the section carries. No set, hence text.
#
# Calibrated for A4 landscape: the 186mm height cap on the image is the usable
# height of that page, and would overflow a portrait one.
label = "Full-page plate"
section_type = text
formats = [a4-landscape]
css = css/templates/plates.css

# The stylesheet selects `.layout > .media + .content`, so the Markdown has to
# be wrapped. Without this key the builder emits bare paragraphs, each of which
# becomes its own grid cell and collides with the plate.
text_container = content

# Dérivée utilisée pour la planche : « book » et non « page ».
# La v1 faisait déjà cette exception (EditorController, branche page-image) :
# une image de 165 mm de haut tirée de la version « page », plafonnée à 1000 px,
# sort à 102 ppi. La version « book » en fait 3600 et rend 415 ppi.
media_version = book
