# Title page.
#
# Renders the Markdown of the section only: generateHTML() pulled no record at
# all here, so section_type is text and there is no merge template to declare.
#
# No formats key: the layout is a centred block with no grid of its own, so it
# holds in any page format. An absent formats list means format-neutral, which
# is not the same thing as an empty one.
#
# Known regression from v1: generateHTML() ran a preg_replace turning a line
# starting with "Editeur : " into <div class="bottom">, which front-matter.css
# still styles as the colophon rule at the foot of the page. Nothing in the new
# chain reproduces it — the block has to come from the Markdown itself.
label = "Title page"
section_type = text
css = css/templates/front-matter.css
