# Running text with a bar of plates on the right.
#
# Mirror of texte-deux-images-gauche, and the same reasoning throughout: text
# plus set, hence mixed; two plates to a page, declared here because the layout
# code holds no figure for BookHtmlBuilder to fall back on.
label = "Text with plates on the right"
section_type = mixed
formats = [a4-landscape]
css = css/templates/sets.css
merge_templates = {
	object_block = "<p class='paragraph-titre'><span class='name'>^ca_objects.preferred_labels.name</span></p>"
}
options = {
	items_per_page = { type = select, values = [1, 2], default = 2 },
	position = { type = select, values = [left, right], default = right }
}

# The stylesheet selects .texte-deux-images-* > .content + .media-bar > .media,
# so the plates must sit in a named container inside the same root as the text.
media_container = media-bar
