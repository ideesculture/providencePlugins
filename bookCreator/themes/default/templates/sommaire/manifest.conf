# Table of contents, generated from the sections of the book.
#
# section_type = summary is specific to this layout: the builder does not
# iterate over a set of works, it walks the sections of the book itself and
# keeps those flagged is_in_summary, pairing each title with the first_page the
# worker recorded while rendering.
#
# This replaces the v1 practice of typing the table of contents as an ordinary
# Markdown section with the page numbers written by hand — which meant that
# inserting one page anywhere invalidated all of them.
#
# The Markdown of the section is still rendered, above the list, so an
# introductory line can be kept.
label = "Table of contents"
section_type = summary
css = css/templates/front-matter.css
show_title = 1
