# Chapter opening, one column of text and one plate.
#
# The plate is the representation pinned on the section (representation_id),
# not a set: v1 read it straight from the section and so does
# BookHtmlBuilder::buildRepresentationBlock(). section_type stays text —
# "set" and "mixed" both mean iterating over a set of works, which this layout
# never does.
#
# No merge template is declared because the pinned representation is not run
# through one: the builder emits its <img> and its preferred label itself. The
# caption of a plate is therefore not configurable per install, unlike the
# notices of the set layouts.
label = "Chapter opening, one column and a plate"
section_type = text
formats = [a4-landscape]
css = css/templates/chapters.css
