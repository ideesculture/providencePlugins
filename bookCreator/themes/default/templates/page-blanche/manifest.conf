# Deliberately blank page.
#
# Carries no content: the section claims a page through the min-height of the
# stylesheet. Format-neutral, hence no formats key.
label = "Blank page"
section_type = text
css = css/templates/front-matter.css

# Nothing to print is the point of this layout, so the generation must not
# report it as a section that produced no content.
allows_empty = 1
