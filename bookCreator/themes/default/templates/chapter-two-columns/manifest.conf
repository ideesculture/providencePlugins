# Chapter opening, two columns.
#
# Text only, like the other chapter openings. The two tracks are a grid of two
# fixed 70mm measures with a 20mm gap, pulled 90mm from the left: that geometry
# is A4 landscape and nothing else.
label = "Chapter opening, two columns"
section_type = text
formats = [a4-landscape]
css = css/templates/chapters.css
options = {
	columns = { type = select, values = [2, 3], default = 2 }
}
