# Title page verso — legal notices, set low and small on the page.
#
# Markdown only, no record: v1 had no branch for this layout, its whole
# appearance comes from the stylesheet. Format-neutral, hence no formats key.
label = "Title page verso"
section_type = text
css = css/templates/front-matter.css

# Usually left blank (the back of the title page), so an empty body is a
# legitimate result here too.
allows_empty = 1
