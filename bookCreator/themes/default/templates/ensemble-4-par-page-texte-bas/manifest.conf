# Set of works, four to a page, notice under the plate.
#
# Same notice as ensemble-6-par-page, in a two-by-two grid: two cells across,
# rows half the usable height of an A4 landscape page. See that manifest for
# what the merge template does and does not reproduce from v1, and for the two
# fields specific to the Floutier profile (mat_et_techniques_txt and the
# work_dimensions container).
label = "Set, four works per page, notice below"
section_type = set
formats = [a4-landscape]
css = css/templates/sets.css
merge_templates = {
	object_block = "<p class='paragraph-titre'><span class='idno'>^ca_objects.idno</span> <span class='name'>^ca_objects.preferred_labels.name</span></p><ifdef code='ca_objects.mat_et_techniques_txt'><p class='mat_et_techniques'>^ca_objects.mat_et_techniques_txt</p></ifdef><ifdef code='ca_objects.inscriptions.inscription_type|ca_objects.inscriptions.inscription_transcription|ca_objects.inscriptions.inscription_place'><p class='inscriptions'>^ca_objects.inscriptions.inscription_type ^ca_objects.inscriptions.inscription_transcription ^ca_objects.inscriptions.inscription_place</p></ifdef><ifdef code='ca_objects.work_dimensions.dimensions_width|ca_objects.work_dimensions.dimensions_height|ca_objects.work_dimensions.dimensions_depth'><p class='dimensions'>L ^ca_objects.work_dimensions.dimensions_width x H ^ca_objects.work_dimensions.dimensions_height<ifdef code='ca_objects.work_dimensions.dimensions_depth'> x P ^ca_objects.work_dimensions.dimensions_depth</ifdef></p></ifdef><ifdef code='ca_objects.description'><p class='description'>^ca_objects.description</p></ifdef>"
}
options = {
	items_per_page = { type = select, values = [2, 4], default = 4 }
}
