# Dedication, centred.
#
# Markdown only. The centred variant and the right-aligned one are the same
# block under two class names; the position option below records the axis they
# differ on, so a later theme can serve both from one stylesheet rule.
# Format-neutral, hence no formats key.
label = "Dedication, centred"
section_type = text
css = css/templates/front-matter.css
options = {
	position = { type = select, values = [center, right], default = center }
}
