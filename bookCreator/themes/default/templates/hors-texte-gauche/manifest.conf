# Plate on the left, text on the right.
#
# v1 read the representation pinned on the section (representation_id) and
# emitted it before the running text; the side it lands on is now decided by
# grid placement in plates.css. No set is involved, so section_type is text.
#
# The caption of that plate is emitted by BookHtmlBuilder itself, from the
# preferred label of the representation, and goes through no merge template —
# nothing to declare here.
#
# Calibrated for A4 landscape: the 62% plate track and the 40mm outer margin
# are measured against that width.
label = "Plate on the left, text on the right"
section_type = text
formats = [a4-landscape]
css = css/templates/plates.css
options = {
	position = { type = select, values = [left, right], default = left }
}
