# Running text with a bar of plates on the left.
#
# generateHTML() rendered the Markdown of the section AND iterated over its
# set, which is exactly what mixed means. Both halves are needed: a section
# using this layout with no text, or with no set, is an editing mistake, not a
# variant.
#
# items_per_page matters here more than anywhere else. The code carries no
# figure, so the fallback of BookHtmlBuilder — reading a number out of the
# layout code — cannot help, and without this declaration a set of ten works
# would be laid out in a single bar that overflows the page instead of
# continuing on the next one. Two is what the bar was drawn for.
#
# The plates carry a title line only. v1 read it from the preferred label of a
# ca_object_representations record, because it treated the members of the set
# as representations; the set members are loaded as ca_objects by RecordLoader,
# so the label read here is the object's. The image itself and its enclosing
# .media div are emitted by BookHtmlBuilder, not by this template.
label = "Text with plates on the left"
section_type = mixed
formats = [a4-landscape]
css = css/templates/sets.css
merge_templates = {
	object_block = "<p class='paragraph-titre'><span class='name'>^ca_objects.preferred_labels.name</span></p>"
}
options = {
	items_per_page = { type = select, values = [1, 2], default = 2 },
	position = { type = select, values = [left, right], default = left }
}

# The stylesheet selects .texte-deux-images-* > .content + .media-bar > .media,
# so the plates must sit in a named container inside the same root as the text.
media_container = media-bar
