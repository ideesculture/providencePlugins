# Plate on the right, text on the left.
#
# Same layout as hors-texte-gauche, mirrored, with the caption set as a credit
# line. Pinned representation, no set, hence text.
label = "Plate on the right, text on the left"
section_type = text
formats = [a4-landscape]
css = css/templates/plates.css
options = {
	position = { type = select, values = [left, right], default = right }
}

# The stylesheet selects `.layout > .media + .content`, so the Markdown has to
# be wrapped. Without this key the builder emits bare paragraphs, each of which
# becomes its own grid cell and collides with the plate.
text_container = content
