# Set of works, six to a page — three across, two down.
#
# generateHTML() iterated over the set (set_id) and built one notice per work,
# so section_type is set. The Markdown of such a section is not printed: the
# root of this layout is a grid whose cells are the works, and a paragraph
# dropped into it would become a grid cell of its own. Editorial text belongs
# to a chapter or to a texte-deux-images section.
#
# Calibrated for A4 landscape only: the row height is half the usable height of
# that page, and three cells across is a property of the grid, not a setting.
#
# The merge template below reproduces the notice of the Floutier catalogue,
# field for field. Two of its fields are specific to that profile and will not
# resolve on another installation:
#   - mat_et_techniques_txt, a local element;
#   - work_dimensions, a local container holding dimensions_width, _height and
#     _depth.
# Both are meant to be overridden per install from the merge_templates block of
# bookCreator.conf, which is what keeps them out of the shipped code.
#
# Differences from the PHP it replaces, none of which a display template can
# express:
#   - ucfirst() on idno, mat_et_techniques_txt, inscriptions and description is
#     lost. The equivalent belongs to the stylesheet, as a ::first-letter rule.
#   - the dimensions line keeps the exact v1 wording and the exact v1 condition
#     (printed as soon as one of the three is filled, depth appended only when
#     present), so a work with a height but no width still prints "L  x H 30",
#     just as before.
#   - the other fields are wrapped in ifdef, which v1 did not do: it emitted
#     empty paragraphs whose margins ate into a cell of fixed height.
label = "Set, six works per page"
section_type = set
formats = [a4-landscape]
css = css/templates/sets.css
merge_templates = {
	object_block = "<p class='paragraph-titre'><span class='idno'>^ca_objects.idno</span>&#160;<span class='name'>^ca_objects.preferred_labels.name</span></p><ifdef code='ca_objects.mat_et_techniques_txt'><p class='mat_et_techniques'>^ca_objects.mat_et_techniques_txt</p></ifdef><ifdef code='ca_objects.inscriptions.inscription_type|ca_objects.inscriptions.inscription_transcription|ca_objects.inscriptions.inscription_place'><p class='inscriptions'>^ca_objects.inscriptions.inscription_type ^ca_objects.inscriptions.inscription_transcription ^ca_objects.inscriptions.inscription_place</p></ifdef><ifdef code='ca_objects.work_dimensions.dimensions_width|ca_objects.work_dimensions.dimensions_height|ca_objects.work_dimensions.dimensions_depth'><p class='dimensions'>L ^ca_objects.work_dimensions.dimensions_width x H ^ca_objects.work_dimensions.dimensions_height<ifdef code='ca_objects.work_dimensions.dimensions_depth'> x P ^ca_objects.work_dimensions.dimensions_depth</ifdef></p></ifdef><ifdef code='ca_objects.description'><p class='description'>^ca_objects.description</p></ifdef>"
}
options = {
	items_per_page = { type = select, values = [3, 6], default = 6 }
}
