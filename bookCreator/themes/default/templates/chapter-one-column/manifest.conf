# Chapter opening, single column.
#
# generateHTML() only prepended the section title to the rendered Markdown for
# any layout whose name contains "chapter": no set, no record, hence text.
#
# Calibrated for A4 landscape: the indent of the running text (60mm) and the
# 46pt chapter title are measured against the width of that page.
label = "Chapter opening, one column"
section_type = text
formats = [a4-landscape]
css = css/templates/chapters.css
