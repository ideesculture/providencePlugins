# Set to 0 to disable the book creator plugin
enabled = 1

# Access control.
#
# The can_use_book_editor_plugin role action is granted through CollectiveAccess
# roles as usual. When no role carries it, this setting decides: 1 leaves the
# plugin open to any logged-in user, 0 restricts it to the roles that grant it.
#
# Shipped at 1 so a fresh install works without configuring roles first. The
# native "default" mechanism of user_actions.conf cannot be used here: it is
# read straight from the CollectiveAccess configuration and ignores the actions
# declared by plugins.
default_access = 1

# Markdown parser used to render section content.
#
#   parsedown  = ParsedownExtra, vendored under lib/. Produced every book
#                printed so far, and stays the reference during the acceptance
#                run against the Floutier catalogue.
#   commonmark = league/commonmark, maintained and spec-compliant.
#
# Both are kept side by side so the acceptance run can produce the same book
# with each and attribute any difference to the parser rather than to the new
# PDF chain. Measured on the 80 sections holding Markdown, 67 render
# identically; the 13 others come from malformed Markdown that ParsedownExtra
# tolerated, and are content to be corrected.
markdown_parser = parsedown

# ----------------------------------------------------------------------------
# PDF rendering
# ----------------------------------------------------------------------------

# Rendering engine.
#
#   weasyprint = local CLI, the default. Installable on a plain Providence
#                server with pip install weasyprint, no orchestrator needed.
#   gotenberg  = HTTP service running Chromium, for Kubernetes installs: the
#                rendering load leaves the Providence pod entirely.
#
# Both consume the same HTML and the same CSS Paged Media stylesheets.
renderer = weasyprint

# Absolute paths of the binaries. Left empty, they are looked up in PATH.
# Chemin explicite : le paquet Debian (weasyprint 62.3) a ete retire au profit
# d'un environnement dedie en 69.0, la version que vise le theme. 62.3 ignorait
# padding-inline-start, min-height: calc(...) et le margin-right negatif imbrique
# des colonnes media -- gouttieres et retraits n'etaient pas appliques au PDF.
# Mise a jour : sudo /opt/weasyprint/bin/pip install -U weasyprint
weasyprint_path = /opt/weasyprint/bin/weasyprint
qpdf_path =

# Internal URL of the Gotenberg service, used only when renderer = gotenberg.
# Never expose this service publicly.
gotenberg_url = http://gotenberg:3000

# Seconds before a single section rendering is killed.
render_timeout = 120

# Directory WeasyPrint offloads its image cache to. Worth setting for large
# catalogues; empty means no disk cache.
image_cache_dir =

# ----------------------------------------------------------------------------
# Background generation
# ----------------------------------------------------------------------------

# Directories the background worker writes to.
#
# job_work_dir holds the per-section HTML and PDF fragments; job_output_dir
# holds the finished book, and must be readable by the web server since that is
# where the download link points. Both default to the tmp/ directory of the
# plugin, which is enough for a single-server install; on Kubernetes point them
# at a shared volume so the Providence pod can serve what the worker pod wrote.
job_work_dir =
job_output_dir =

# ----------------------------------------------------------------------------
# Section cache: only re-render what changed
# ----------------------------------------------------------------------------

# Reuse the PDF of a section whose content has not changed since the last
# generation.
#
# A book is already rendered one section at a time and assembled with qpdf, so
# the engine is the only expensive part and it is per section. On a catalogue of
# fifty sections where one has been edited -- which is what an editor does all
# day -- this turns a full re-render into one.
#
# The rule is conservative: the fingerprint is taken over the HTML document
# itself, plus every local file it points at, the theme directory, the plugin's
# own code and configuration, and the version of the PDF engine. Anything that
# cannot be established -- a plate missing from disk, which the builder replaces
# with an HTTP URL -- makes the section uncacheable and it is rendered. See the
# header of lib/BookSectionCache.php for what is covered and what is not.
#
# Entries live under <job_work_dir>/cache/book-<id>/ and are purged as they are
# superseded; php bin/bookworker.php --purge-cache empties them all.
section_cache = 1

# How the plates are digested.
#
#   stat    = size and modification time. Default: a derivative rewritten by
#             CollectiveAccess always changes at least one of the two.
#   content = read and hash every plate on every generation. Closes the case of
#             a file replaced with one of exactly the same size and timestamp,
#             at the cost of reading the media of the whole book each time.
section_cache_media_digest = stat

# Free text folded into every fingerprint. Changing it invalidates the whole
# cache without touching a file: the way to declare a change the fingerprint
# cannot see by itself, such as a Gotenberg service upgraded in place.
section_cache_epoch =

# Media derivative used for the plates of a book.
#
# Pre-sized versions only: never the originals, which would blow up both the
# rendering memory and the weight of the PDF. "page" is the version the v1 used
# and the one the Floutier profile declares; an installation whose media
# processing names it differently sets it here.
media_version = page

# Directory holding the cover PDFs.
#
# The cover of a book is recorded as a file NAME, resolved inside this
# directory and nowhere else: it used to be a free path concatenated into the
# assembly command, so any PDF readable by the worker could be bound into a
# book and downloaded. Empty means assets/covers of the plugin, which ships an
# .htaccess denying direct web access.
covers_dir =

# ----------------------------------------------------------------------------
# Gotenberg driver (only read when renderer = gotenberg)
# ----------------------------------------------------------------------------

# Let the @page rule of the stylesheet decide the sheet size rather than the
# form fields. Turned off automatically when a bleed is requested, the CSS size
# being the trimmed format while the sheet has to be larger.
gotenberg_prefer_css_page_size = 1

# Print background colours and images. Off would drop every plate laid out as a
# CSS background, which is how the grids place their images.
gotenberg_print_background = 1

# Make the service answer with an error when a stylesheet, a font or an image
# could not be loaded. Off, it returns a valid PDF with holes in it and an HTTP
# 200 — the failure would only be seen on the printed copy.
gotenberg_fail_on_resource_error = 1

# Allow a section to be rendered even though its page numbering will restart
# at 1. Chromium implements neither counter-reset on @page nor string-set, so
# with this driver a book rendered section by section carries wrong folios and
# empty running heads; the driver refuses rather than deliver that silently.
# Turn on only for a single-section book or a throwaway preview.
gotenberg_allow_restarted_page_numbering = 0
