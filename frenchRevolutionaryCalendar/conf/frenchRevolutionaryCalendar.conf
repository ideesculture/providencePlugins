# Default configuration for frenchRevolutionaryCalendar plugin
# To enable on a specific instance, copy this file to conf/local/frenchRevolutionaryCalendar.conf
# and customize. Files in conf/local/ are gitignored.

# Set to 1 to enable the plugin
enabled = 0

# Set to 1 to strip square brackets from date expressions before parsing
# (useful for library catalogs where dates are written as "[an V]")
removeSquareBrackets = 1

# Keywords to strip from date expressions before parsing
# Useful for cleaning up bibliographic prefixes (DL = depot legal, IMPR = imprime, COP = copyright, etc.)
# The list is applied longest-first, so "COP." is removed before "COP" and no orphan period survives.
removeKeywords = ["DL","IMPR","COP","IMPR.","COP.","DL.","copyright","impr."]

# Set to 1 to normalize "no date" markers (see undatedMarkers below) into the
# undated token understood by the locale's .lang file. Disabled by default:
# enabling it changes how date fields behave for every record of the instance.
normalizeUndated = 0

# Markers that mean "this object is not dated". Matched against the WHOLE
# expression only (case-insensitive, surrounding spaces ignored), never as a
# substring: "1950?" stays a circa date, and no identifier containing "sd" or
# "nd" is ever touched.
# Do not also list these in removeKeywords: they would be stripped first and the
# expression would be empty before it could be recognized here.
undatedMarkers = ["?","??","???","????","s.d.","sd","sans date","n.d.","nd","nd."]

# Token substituted for a recognized marker. It MUST be listed in undatedDate in
# app/lib/Parsers/TimeExpressionParser/<locale>.lang, otherwise the expression
# will be rejected as an invalid date.
undatedToken = undated
