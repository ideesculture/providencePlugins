# === D2026-0103 — écran de sélection des contenants : début ===
# Configuration du plugin selectionContenants (marché INRAP 036SE2025).
enabled = 1

# Codes des types de contenants (liste object_types) — TOUJOURS résolus par
# code au chargement, jamais d'item_id en dur (les ids diffèrent entre bases).
contenant_type_codes = [contenant, contenant_mob_verse, contenant_intermediaire, contenant_doc_verse, numerique, contenant_num_verse]

# Code du type de relation mouvement→objet employé pour le rattachement
# (ca_movements_x_objects ; constaté en base : la totalité des 29 486
# rattachements existants portent ce type).
movement_object_relationship_type = related

# === 7963 (point 10) — familles de contenants ===
# Le client raisonne en FAMILLES (mobilier / documentation / numérique), pas en
# types CollectiveAccess : le filtre « Type de contenant » de l'écran de
# sélection liste ces familles, pas les six types. Chaque famille porte un
# libellé imprimé tel quel et la liste des CODES de types qui la composent.
#
# Un type présent à l'écran mais déclaré dans aucune famille reste filtrable
# SOUS SON PROPRE NOM : ajouter un code à contenant_type_codes sans le ranger
# ci-dessous n'escamote jamais ses contenants du filtre — il suffit ensuite de
# l'ajouter à la bonne famille pour qu'il la rejoigne. Aucun développement.
#
# Le type « VAB » évoqué au ticket 7963 N'EXISTE PAS : vérifié le 11/09/2026,
# la liste object_types compte 15 types et aucun ne porte ce code ni ce
# libellé. Rien n'est donc déclaré pour lui.
contenant_type_families = {
	mobilier = {
		label = Mobilier,
		types = [contenant, contenant_mob_verse]
	},
	documentation = {
		label = Documentation,
		types = [contenant_intermediaire, contenant_doc_verse]
	},
	numerique = {
		label = Numérique,
		types = [numerique, contenant_num_verse]
	}
}
# === D2026-0103 — écran de sélection des contenants : fin ===
